<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>TechnoGrowth · Chinese Cabbage Monitor</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <style>
        :root {
            --green-primary: #2E8B3A;
            --green-dark:    #1F6B2A;
            --green-medium:  #4CAF50;
            --green-light:   #E8F5E9;
            --green-lighter: #F1FBF2;
            --green-accent:  #66BB6A;
            --green-bg:      #6CC070;
            --sidebar-bg:    #FFFFFF;
            --sidebar-w:     130px;
            --white:         #FFFFFF;
            --text-dark:     #1A1A1A;
            --text-mid:      #444444;
            --text-muted:    #777777;
            --text-light:    #999999;
            --border:        #E0E0E0;
            --border-light:  #F0F0F0;
            --orange:        #FF9800;
            --orange-light:  #FFF3E0;
            --blue:          #2196F3;
            --blue-light:    #E3F2FD;
            --red:           #F44336;
            --shadow:        0 1px 4px rgba(0,0,0,0.08);
            --shadow-md:     0 2px 10px rgba(0,0,0,0.10);
            --r:              8px;
            --r-sm:           6px;
            --sans:          'Plus Jakarta Sans', sans-serif;
        }

        *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
        html,body { font-family:var(--sans); background:var(--green-bg); color:var(--text-dark); font-size:13px; line-height:1.5; min-height:100vh; }
        
        .layout { display:flex; min-height:100vh; }
        .main   { margin-left:var(--sidebar-w); flex:1; display:flex; flex-direction:column; }

        .sidebar {
            width:var(--sidebar-w);
            background:var(--white);
            position:fixed; top:0; left:0; bottom:0;
            display:flex; flex-direction:column;
            z-index:100; box-shadow:2px 0 8px rgba(0,0,0,0.08);
        }
        .sb-brand {
            padding:16px 12px 14px;
            border-bottom:1px solid var(--border-light);
            display:flex; align-items:center; gap:8px;
        }
        .sb-logo {
            width:32px; height:32px; border-radius:8px;
            background:var(--green-primary);
            display:flex; align-items:center; justify-content:center; flex-shrink:0;
        }
        .sb-brand-txt strong { display:block; font-size:11px; font-weight:700; color:var(--text-dark); }
        
        .sb-nav { flex:1; padding:10px 8px; }
        .nav-item {
            display:flex; align-items:center; gap:8px;
            padding:9px 10px; border-radius:var(--r-sm);
            color:var(--text-muted); font-size:12px; font-weight:500;
            cursor:pointer; transition:all .15s; margin-bottom:2px;
        }
        .nav-item.active { background:var(--green-light); color:var(--green-primary); font-weight:600; }
        .nav-item svg { width:14px; height:14px; flex-shrink:0; }

        .content {
            background:var(--white);
            margin:12px 12px 12px 0;
            border-radius:12px;
            flex:1;
            overflow:hidden;
            box-shadow:var(--shadow-md);
        }

        .topbar {
            background:var(--green-primary);
            padding:12px 20px;
            display:flex; align-items:center; gap:12px;
            border-radius:12px 12px 0 0;
        }
        .crop-info strong { display:block; font-size:13px; font-weight:700; color:#fff; }
        .crop-info span   { font-size:10px; color:rgba(255,255,255,0.75); }

        .page-section { display:none; padding:20px; }
        .page-section.active { display:block; }

        .health-banner {
            background:var(--green-light);
            border:1px solid #C8E6C9;
            border-radius:var(--r);
            padding:16px 20px;
            display:flex; align-items:center; justify-content:space-between;
            margin-bottom:14px;
        }
        .health-img {
            width:90px; height:70px; border-radius:var(--r);
            overflow: hidden;
            background:#f0f0f0;
            display:flex; align-items:center; justify-content:center;
            flex-shrink:0;
        }
        .health-img img { width: 100%; height: 100%; object-fit: cover; }

        .sensor-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:14px; }
        .sensor-card {
            background:var(--white); border:1px solid var(--border-light);
            border-radius:var(--r); padding:12px 14px; box-shadow:var(--shadow);
        }
        .sensor-label { font-size:10px; color:var(--text-muted); display:flex; align-items:center; gap:4px; margin-bottom:6px; }
        .sensor-val { font-size:22px; font-weight:700; color:var(--text-dark); }
        
        .growth-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px; }
        .score-big { font-size:42px; font-weight:700; color:var(--green-primary); line-height:1; }

        canvas { width:100%!important; }
    </style>
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <div class="sb-brand">
            <div class="sb-logo">🥬</div>
            <div class="sb-brand-txt">
                <strong>TechnoGrowth</strong>
                <span>Monitor System</span>
            </div>
        </div>
        <nav class="sb-nav">
            <div class="nav-item active" data-page="dashboard">Dashboard</div>
            <div class="nav-item" data-page="analytics">Analytics</div>
        </nav>
    </aside>

    <main class="main">
        <div class="content">
            <div class="topbar">
                <div class="crop-info">
                    <strong>Chinese Cabbage Monitor</strong>
                    <span id="last-updated">Waiting for data...</span>
                </div>
            </div>

            <div class="page-section active" id="page-dashboard">
                <div class="health-banner">
                    <div class="health-left">
                        <strong style="color:var(--green-primary); font-size:18px;">Growth Status: Healthy</strong>
                        <div style="margin-top:4px; color:var(--text-muted);">Current Stage: Late Vegetative</div>
                    </div>
                    <div class="health-img">
                        <img id="cabbage-photo" src="/growth_photos/latest_cabbage.jpg" onerror="this.src='https://via.placeholder.com/90x70?text=Cabbage'">
                    </div>
                </div>

                <div class="sensor-grid">
                    <div class="sensor-card">
                        <div class="sensor-label">Temperature</div>
                        <div class="sensor-val" id="dash-temp">--°C</div>
                    </div>
                    <div class="sensor-card">
                        <div class="sensor-label">Humidity</div>
                        <div class="sensor-val" id="dash-humid">--%</div>
                    </div>
                    <div class="sensor-card">
                        <div class="sensor-label">Soil Moisture (Avg)</div>
                        <div class="sensor-val" id="dash-moist">--%</div>
                    </div>
                    <div class="sensor-card">
                        <div class="sensor-label">NPK Status</div>
                        <div class="sensor-val" id="dash-npk" style="font-size:16px;">--</div>
                    </div>
                </div>

                <div class="growth-row">
                    <div class="sensor-card">
                        <div class="sensor-label">Soil Sensor 1</div>
                        <div class="sensor-val" id="dash-s1">--%</div>
                    </div>
                    <div class="sensor-card">
                        <div class="sensor-label">Soil Sensor 2</div>
                        <div class="sensor-val" id="dash-s2">--%</div>
                    </div>
                </div>

                <div class="sensor-card" style="height:200px;">
                    <div class="sensor-label">24h Temperature Trend</div>
                    <canvas id="dashChart"></canvas>
                </div>
            </div>

            <div class="page-section" id="page-analytics">
                <div class="sensor-card">
                    <div class="score-big" id="growth-score">88</div>
                    <div style="color:var(--text-muted);">Growth Score</div>
                </div>
            </div>
        </div>
    </main>
</div>

<script>
    // Navigation Logic
    document.querySelectorAll('.nav-item[data-page]').forEach(item => {
        item.addEventListener('click', () => {
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            item.classList.add('active');
            document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
            document.getElementById('page-' + item.dataset.page).classList.add('active');
        });
    });

    // Real-Time Update Logic
    async function updateRealtimeData() {
        try {
            const response = await fetch('/api/sensors');
            if (!response.ok) throw new Error('Backend unreachable');
            
            const data = await response.json();

            // Update Air & Soil Text
            document.getElementById('dash-temp').textContent = `${data.temperature}°C`;
            document.getElementById('dash-humid').textContent = `${data.humidity}%`;
            document.getElementById('dash-moist').textContent = `${data.soil_moisture}%`;
            document.getElementById('dash-s1').textContent = `${data.moisture_1}%`;
            document.getElementById('dash-s2').textContent = `${data.moisture_2}%`;
            
            // Update NPK Status
            const npk = data.npk;
            document.getElementById('dash-npk').textContent = `N:${npk.nitrogen} P:${npk.phosphorus} K:${npk.potassium}`;

            // Refresh Photo (Adds timestamp to prevent browser cache)
            const photoImg = document.getElementById('cabbage-photo');
            if (photoImg && data.image_url) {
                photoImg.src = `${data.image_url}?t=${new Date().getTime()}`;
            }

            // Update Timestamp
            document.getElementById('last-updated').textContent = `Last Sync: ${data.timestamp}`;

        } catch (err) {
            console.error("Dashboard Sync Error:", err);
            document.getElementById('last-updated').textContent = "Connection Lost";
        }
    }

    // Refresh every 10 seconds to match Thonny script
    setInterval(updateRealtimeData, 10000);
    updateRealtimeData();

    // Chart Initialization
    const ctx = document.getElementById('dashChart').getContext('2d');
    new Chart(ctx, {
        type: 'line',
        data: {
            labels: ['12am', '4am', '8am', '12pm', '4pm', '8pm'],
            datasets: [{
                label: 'Temperature',
                data: [26, 25, 27, 29, 30, 28],
                borderColor: '#2E8B3A',
                tension: 0.4
            }]
        }
    });
</script>
</body>
</html>
